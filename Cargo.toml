[workspace]
members = ["crates/graviplex-engine", "crates/graviplex"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
# Core dependencies
bytemuck = "1.22.0"
wgpu = "26.0.1"
winit = "0.30.7"

# GUI
egui = { version = "0.33.0", default-features = true }
egui-winit = { version = "0.33.0", default-features = false }

# Utilities
rand = "0.9.2"
rayon = "1.10"
ultraviolet = "0.9.2"
pollster = "0.4.0"
env_logger = "0.11.6"
log = "0.4.22"

# Dev
criterion = { version = "0.5", features = ["html_reports"] }

# Internal
graviplex-engine = { path = "crates/graviplex-engine" }
