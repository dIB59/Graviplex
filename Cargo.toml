[package]
name = "graviplex"
version = "0.3.0"
edition = "2021"
description = "A 2D GPU-accelerated game engine with immediate-mode drawing API"
repository = "https://github.com/ibrahim/Graviplex"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "graphics", "2d", "wgpu", "game-engine"]
categories = ["game-development", "graphics", "rendering"]

[features]
default = ["gui", "textures"]
gui = ["dep:egui", "dep:egui-winit"]
physics = []
textures = ["dep:image", "dep:rectangle-pack"]
audio = ["dep:rodio"]
serialize = ["dep:serde", "dep:serde_json"]

[dependencies]
bytemuck = "1.24.0"
wgpu = "26.0.1"
winit = "0.30.12"
egui = { version = "0.33.3", default-features = true, optional = true }
egui-winit = { version = "0.33.3", default-features = false, optional = true }
ultraviolet = "0.9.2"
pollster = "0.4.0"
log = "0.4.29"
rand = "0.8.5"
# Optional dependencies for engine systems
image = { version = "0.25", optional = true }
rectangle-pack = { version = "0.4", optional = true }
rodio = { version = "0.19", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# ECS - wrapped behind our API for future replacement
hecs = "0.10"

[[example]]
name = "ecs_sprites"
required-features = ["textures"]

[[example]]
name = "sprite_demo"
required-features = ["textures"]
