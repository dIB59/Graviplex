[package]
name = "graviplex"
version = "0.3.0"
edition = "2021"
description = "A 2D GPU-accelerated game engine with immediate-mode drawing API"
repository = "https://github.com/dIB59/Graviplex"
license = "MIT OR Apache-2.0"
keywords = ["gamedev", "graphics", "2d", "wgpu", "game-engine"]
categories = ["game-development", "graphics", "rendering"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:egui-winit"]
physics = []

[dependencies]
bytemuck = "1.22.0"
# Compute shaders require WebGPU on the wasm target — WebGL2 doesn't support
# them. This excludes browsers that don't yet have WebGPU enabled (Firefox
# stable as of 2026 still gates it behind a flag; Safari has it on 18+).
wgpu = "26.0.1"
winit = "0.30.7"
egui = { version = "0.33.0", default-features = true, optional = true }
egui-winit = { version = "0.33.0", default-features = false, optional = true }
ultraviolet = "0.9.2"
pollster = "0.4.0"
log = "0.4.22"
rand = "0.8.5"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
# rand 0.8.x transitively pulls getrandom 0.2; activate the js feature so it
# uses Web Crypto in browsers.
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Performance",
    "Location",
] }
